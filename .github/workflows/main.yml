from flask import Flask, request, jsonify, render_template_string
import os

app = Flask(__name__)

# Simple homepage
@app.route('/')
def home():
    return '''
    <!DOCTYPE html>
    <html>
    <head><title>DAST Test App</title></head>
    <body>
        <h1>OWASP ZAP DAST Test Application</h1>
        <p>Ready for scanning on port 8080!</p>
        <a href="/api/users">API Users</a> | 
        <a href="/search">Search</a> | 
        <a href="/login">Login</a>
    </body>
    </html>
    '''

# REST API endpoint (common vuln targets)
@app.route('/api/users', methods=['GET', 'POST'])
def users():
    if request.method == 'POST':
        user_id = request.form.get('id', '')
        # Intentional: No input sanitization for DAST to find XSS
        return f'<h1>User {user_id}</h1><script>alert("XSS Test")</script>'
    return jsonify([
        {'id': 1, 'name': 'John Doe'},
        {'id': 2, 'name': 'Jane Smith'}
    ])

# Search endpoint (XSS/SQLi target)
@app.route('/search')
def search():
    query = request.args.get('q', '')
    # DAST will flag unsanitized output
    return f'<h2>Search results for: {query}</h2><p>No results found.</p>'

# Login form (CSRF target)
@app.route('/login', methods=['GET', 'POST'])
def login():
    if request.method == 'POST':
        username = request.form.get('username', '')
        password = request.form.get('password', '')
        return f'<p>Logged in as {username} (pass: {password})</p>'
    
    return '''
    <form method="POST">
        Username: <input name="username"><br>
        Password: <input name="password" type="password"><br>
        <input type="submit" value="Login">
    </form>
    '''

# Vulnerable file upload
@app.route('/upload', methods=['POST'])
def upload():
    if 'file' in request.files:
        file = request.files['file']
        filename = file.filename
        return f'Uploaded: {filename}'  # Path traversal target
    return 'No file'

if __name__ == '__main__':
    port = int(os.environ.get('PORT', 8080))
    app.run(host='0.0.0.0', port=port, debug=False)
