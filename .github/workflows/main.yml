name: CI

on: [push]

jobs:
  sast_scan:
   name: Run Bandit scan
   runs-on: ubuntu-latest

   steps:
     - name: Checkout code
       uses: actions/Checkout@v2

     - name: set uo python
      use: action/setup-python@v2
      with:
       python-version:3.8

     - name: Install Bandit 
       run: pip install dandit

     - name: Run Bandit Scan 
       run: dandit -ll -ii -r.
 
